name: Feature request
description: Suggest an improvement to the Mac capture and library experience.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Brain Cache focuses on fast, private, local capture. This source preview is Mac only.
        Check [existing issues](https://github.com/klmrmt/brain-cache/issues) and the [backlog](https://github.com/klmrmt/brain-cache/blob/main/FEATURE_BACKLOG.md) first.
        Describe your workflow with sample data, not personal thoughts or attachments.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe when it happens and how it affects your use of Brain Cache.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful result look like?
      description: Explain the behavior you need. A specific implementation is optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
      description: Include any existing behavior that comes close and what is missing.
